<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">IDEArc Kelime Bulutu</title>
  <desc id="desc">IDEArc için yer tutucu kelime bulutu görseli</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d2d" />
      <stop offset="100%" stop-color="#14324c" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="18" ry="18" />
  <g fill="#f5f7fb" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700">
    <text x="50%" y="150" font-size="64" text-anchor="middle" opacity="0.9">IDEArc</text>
    <text x="26%" y="260" font-size="34" opacity="0.85">BIM</text>
    <text x="50%" y="250" font-size="28" opacity="0.8">Dijital İkiz</text>
    <text x="72%" y="270" font-size="30" opacity="0.8">Sürdürülebilirlik</text>
    <text x="30%" y="340" font-size="26" opacity="0.75">Mobilite</text>
    <text x="50%" y="340" font-size="22" opacity="0.75">Otomasyon</text>
    <text x="68%" y="340" font-size="26" opacity="0.78">Mega Projeler</text>
    <text x="25%" y="420" font-size="24" opacity="0.7">Dijital Dönüşüm</text>
    <text x="50%" y="430" font-size="24" opacity="0.7">UKOME</text>
    <text x="70%" y="420" font-size="24" opacity="0.7">Altyapı</text>
    <text x="50%" y="500" font-size="20" opacity="0.65" text-anchor="middle">Kelime bulutunuzu burada güncelleyebilirsiniz</text>
  </g>
</svg>
